<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d0d">
  <title>深井余烬 · EMBER DEEP</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="深井余烬，可探索的像素洞穴" tabindex="0"></canvas>
    <div id="hud">
      <div class="brand">深井余烬 <span>EMBER DEEP</span></div>
      <div id="location"><b id="biome">锈脉矿坑</b><span id="depth">000 m</span></div>
      <div id="vitals">
        <div class="vital health"><span aria-hidden="true">♥</span><div class="track"><i id="hpFill"></i></div><output id="hpText">100 / 100</output></div>
        <div class="vital mana"><span aria-hidden="true">◆</span><div class="track"><i id="manaFill"></i></div><output id="manaText">120</output></div>
        <div class="vital flight"><span aria-hidden="true">↑</span><div class="track"><i id="hoverFill"></i></div><output id="hoverText">100%</output></div>
        <div id="statuses"></div>
      </div>
      <div id="runInfo"><span id="gold">0 G</span><span id="kills">0 击杀</span></div>
      <div id="loadout"><div id="wandHud"></div><div id="castHud"></div></div>
      <div id="materialLabel"></div>
    </div>
    <nav id="tools" aria-label="游戏设置">
      <button id="soundBtn" class="icon-button" title="开启音效" aria-label="开启音效" aria-pressed="false">♪</button>
      <button id="pauseBtn" class="icon-button" title="暂停" aria-label="暂停">Ⅱ</button>
    </nav>
    <button id="interactBtn" class="command hide"></button>
    <div id="toast" role="status"></div>
    <div class="touch-controls" aria-label="触屏控制">
      <button id="leftBtn" class="touch-button" aria-label="向左移动">◀</button>
      <button id="rightBtn" class="touch-button" aria-label="向右移动">▶</button>
      <button id="jumpBtn" class="touch-button" aria-label="跳跃与悬浮">↑</button>
      <button id="fireBtn" class="touch-button" aria-label="拖动瞄准并施法"><span>✦</span><i></i></button>
    </div>
    <section id="pausePanel" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
      <div class="dialog narrow">
        <span class="eyebrow">EMBER DEEP</span><h1 id="pauseTitle">远征暂停</h1>
        <p id="pauseStats" class="muted"></p>
        <label class="setting">屏幕震动<input id="shakeSetting" type="checkbox" checked></label>
        <label class="setting">音效<input id="soundSetting" type="checkbox"></label>
        <button id="resumeBtn" class="command primary">继续远征</button>
        <button id="newRunBtn" class="command">重新开始</button>
      </div>
    </section>
    <section id="resultPanel" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <div class="dialog narrow result">
        <span class="eyebrow">EMBER DEEP / 远征记录</span><h1 id="resultTitle">余烬熄灭</h1>
        <p id="deadReason"></p><p id="deathDetail" class="muted"></p>
        <div id="runStats"></div><button id="restartBtn" class="command primary">再次深入</button>
      </div>
    </section>
    <section id="wandPanel" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="editorTitle"></section>
    <section id="perkPanel" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="perkTitle"></section>
    <section id="pickupPanel" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="pickupTitle"></section>
    <div id="spellTooltip" class="hide" role="tooltip"></div>
    <div id="dragGhost" class="hide"></div>
  </main>
  <script src="game.js"></script>
</body>
</html>
